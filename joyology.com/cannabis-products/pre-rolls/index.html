<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Rolls | Joyology Cannabis</title>
    <link rel="icon" href="/media/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <meta http-equiv="refresh" content="2;url=/shop/#pre-rolls">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{--green:#8CC541;--root:#1A1F1C;--cloud:#F4F7F5;--white:#FFFFFF;--teal:#2A7C6F}
        body{font-family:'Nunito',sans-serif;background:var(--cloud);color:var(--root);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
        .card{background:var(--white);border-radius:24px;padding:48px;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,0.06)}
        .card img{height:56px;margin-bottom:24px}
        h1{font-size:24px;font-weight:900;margin-bottom:8px}
        p{color:#9BA5A1;font-size:15px;margin-bottom:24px;line-height:1.6}
        a{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--white);padding:14px 32px;border-radius:50px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;text-decoration:none;transition:all 0.3s}
        a:hover{background:var(--teal);transform:translateY(-2px)}
        .spinner{width:24px;height:24px;border:3px solid var(--cloud);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 20px}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="card">
        <img src="/media/logo-gradient-cannabis.png" alt="Joyology Cannabis">
        <div class="spinner"></div>
        <h1>Browse Pre-Rolls</h1>
        <p>We've upgraded our shopping experience. Redirecting you to our pre-rolls selection.</p>
        <a href="/shop/#pre-rolls">Shop pre-rolls</a>
    </div>
    <script>setTimeout(function(){window.location.href='/shop/#pre-rolls';},2000);</script>
</body>
</html>
